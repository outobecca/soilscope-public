<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="65%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <!-- Glow Filter -->
    <!-- Gradients for Plant -->
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#00B8FF"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009955"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
    <!-- Gradients for Atmosphere Dome -->
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 184, 255, 0.15)"/>
      <stop offset="80%" stop-color="rgba(0, 184, 255, 0.02)"/>
      <stop offset="100%" stop-color="rgba(0, 184, 255, 0.1)"/>
    </linearGradient>
    <!-- Gradients for Soil Glass -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 255, 136, 0.15)"/>
      <stop offset="100%" stop-color="rgba(0, 184, 255, 0.05)"/>
    </linearGradient>
    <!-- Accent Line Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00B8FF"/>
      <stop offset="50%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
    <!-- Dot Pattern for Background -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.3"/>
    </pattern>
    <!-- Leaf Symbol -->
    <g id="leaf">
      <path d="M 0 0 C -2 -10, -15 -25, -35 -35 C -25 -15, -10 -2, 0 0 Z" fill="url(#leafGrad)"/>
      <path d="M 0 0 C -5 -8, -15 -18, -25 -25" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
      <path d="M -8 -5 L -12 -8 M -15 -12 L -20 -15 M -22 -20 L -28 -24" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>
    </g>
  </defs>
  <!-- Background -->
  <rect width="1440" height="720" fill="url(#bgGrad)"/>
  <rect width="1440" height="720" fill="url(#dotGrid)"/>
  <!-- Ambient Background Glow -->
  <circle cx="1000" cy="360" r="350" fill="#00B8FF" opacity="0.05"/>
  <circle cx="1000" cy="450" r="250" fill="#00FF88" opacity="0.05"/>
  <!-- ========================================== -->
  <!-- LEFT SIDE: TYPOGRAPHY & BRANDING           -->
  <!-- ========================================== -->
  <g transform="translate(100, 0)">
    <!-- Vertical Accent Line -->
    <rect x="0" y="240" width="4" height="240" rx="2" fill="url(#accentGrad)"/>
    <!-- Title -->
    <text x="30" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">
      Soil<tspan fill="#00FF88">Scope</tspan>
    </text>
    <!-- Subtitle -->
    <text x="30" y="365" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">
      The Soil-Plant-Atmosphere Simulator
    </text>
    <!-- Description -->
    <text x="30" y="415" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#94A3B8">
      <tspan x="30" dy="0">Model complex botanical ecosystems with high-fidelity</tspan>
      <tspan x="30" dy="28">thermodynamic and hydraulic simulations. Analyze</tspan>
      <tspan x="30" dy="28">water flux, carbon assimilation, and soil mechanics</tspan>
      <tspan x="30" dy="28">in a unified, real-time digital twin environment.</tspan>
    </text>
    <!-- Tech Accents -->
    <path d="M 30 550 L 80 550 L 90 540 L 250 540" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="30" cy="550" r="4" fill="#00B8FF"/>
    <circle cx="250" cy="540" r="3" fill="#334155"/>
    <text x="30" y="580" font-family="monospace" font-size="12" fill="#64748B" letter-spacing="2">SYS.STATUS: ONLINE // V.2.4.0</text>
  </g>
  <!-- ========================================== -->
  <!-- RIGHT SIDE: THE SIMULATOR                  -->
  <!-- ========================================== -->
  <g id="simulator" transform="translate(0, 10)">
    <!-- 1. ATMOSPHERE BACK DOME -->
    <path d="M 760 450 A 240 360 0 0 1 1240 450 Z" fill="url(#domeGrad)"/>
    <path d="M 760 450 A 240 360 0 0 1 1240 450" fill="none" stroke="#00B8FF" stroke-width="1" opacity="0.3"/>
    <!-- Dome Holographic Rings (Back) -->
    <path d="M 780 350 A 220 60 0 0 1 1220 350" fill="none" stroke="#00B8FF" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>
    <path d="M 830 240 A 170 40 0 0 1 1170 240" fill="none" stroke="#00B8FF" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>
    <path d="M 920 140 A 80 20 0 0 1 1080 140" fill="none" stroke="#00B8FF" stroke-width="1" stroke-dasharray="4 8" opacity="0.2"/>
    <!-- 2. SOIL CYLINDER BACK WALL (Inside View) -->
    <!-- Topsoil Layer -->
    <path d="M 760 450 A 240 80 0 0 1 1240 450 L 1240 490 A 240 80 0 0 0 760 490 Z" fill="#1B2A22"/>
    <!-- Subsoil Layer -->
    <path d="M 760 490 A 240 80 0 0 1 1240 490 L 1240 560 A 240 80 0 0 0 760 560 Z" fill="#15202B"/>
    <!-- Bedrock Layer -->
    <path d="M 760 560 A 240 80 0 0 1 1240 560 L 1240 620 A 240 80 0 0 0 760 620 Z" fill="#0D131F"/>
    <!-- Soil Particles / Minerals on Back Wall -->
    <circle cx="900" cy="520" r="4" fill="#FFB800" opacity="0.4"/>
    <circle cx="1120" cy="500" r="3" fill="#FFB800" opacity="0.5"/>
    <circle cx="1050" cy="580" r="5" fill="#00B8FF" opacity="0.3"/>
    <circle cx="850" cy="590" r="6" fill="#00B8FF" opacity="0.2"/>
    <polygon points="1150,570 1155,565 1165,568 1160,575" fill="#FFB800" opacity="0.3"/>
    <polygon points="880,470 885,465 892,468 888,475" fill="#00FF88" opacity="0.2"/>
    <!-- 3. SOIL SURFACE GRID (Isometric Projection) -->
    <g transform="translate(1000, 450) scale(1, 0.333)">
      <circle cx="0" cy="0" r="240" fill="#0A1612" opacity="0.8"/>
      <circle cx="0" cy="0" r="240" fill="none" stroke="#00FF88" stroke-width="3" vector-effect="non-scaling-stroke"/>
      <!-- Grid Lines -->
      <g stroke="#00FF88" stroke-width="1" opacity="0.3" vector-effect="non-scaling-stroke">
        <!-- Verticals -->
        <path d="M -200 -132 L -200 132"/>
        <path d="M -160 -178 L -160 178"/>
        <path d="M -120 -207 L -120 207"/>
        <path d="M -80 -226 L -80 226"/>
        <path d="M -40 -236 L -40 236"/>
        <path d="M 0 -240 L 0 240"/>
        <path d="M 40 -236 L 40 236"/>
        <path d="M 80 -226 L 80 226"/>
        <path d="M 120 -207 L 120 207"/>
        <path d="M 160 -178 L 160 178"/>
        <path d="M 200 -132 L 200 132"/>
        <!-- Horizontals -->
        <path d="M -132 -200 L 132 -200"/>
        <path d="M -178 -160 L 178 -160"/>
        <path d="M -207 -120 L 207 -120"/>
        <path d="M -226 -80 L 226 -80"/>
        <path d="M -236 -40 L 236 -40"/>
        <path d="M -240 0 L 240 0"/>
        <path d="M -236 40 L 236 40"/>
        <path d="M -226 80 L 226 80"/>
        <path d="M -207 120 L 207 120"/>
        <path d="M -178 160 L 178 160"/>
        <path d="M -132 200 L 132 200"/>
      </g>
    </g>
    <!-- 4. ROOTS (Below Surface) -->
    <g id="roots" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main Taproot (Tapered) -->
      <path d="M 1000 450 C 1005 480, 995 520, 1000 550" stroke="#00FF88" stroke-width="6" opacity="0.9"/>
      <path d="M 1000 550 C 1005 580, 990 620, 1000 660" stroke="#00FF88" stroke-width="3" opacity="0.8"/>
      <path d="M 1000 450 C 1005 480, 995 520, 1000 550 C 1005 580, 990 620, 1000 660" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
      
      <!-- Primary Laterals -->
      <path d="M 1002 475 C 1040 485, 1070 520, 1100 550" stroke="#00FF88" stroke-width="3.5" opacity="0.8"/>
      <path d="M 998 485 C 960 495, 930 530, 900 560" stroke="#00FF88" stroke-width="3.5" opacity="0.8"/>
      <path d="M 1001 530 C 1035 550, 1050 580, 1060 620" stroke="#00FF88" stroke-width="2.5" opacity="0.7"/>
      <path d="M 999 540 C 965 560, 950 590, 940 630" stroke="#00FF88" stroke-width="2.5" opacity="0.7"/>
      
      <!-- Secondary Laterals (Branching from Primary) -->
      <path d="M 1060 505 C 1080 500, 1110 510, 1130 505" stroke="#00FF88" stroke-width="1.8" opacity="0.6"/>
      <path d="M 940 515 C 920 510, 890 520, 870 515" stroke="#00FF88" stroke-width="1.8" opacity="0.6"/>
      <path d="M 1045 560 C 1065 575, 1080 600, 1090 630" stroke="#00FF88" stroke-width="1.5" opacity="0.5"/>
      <path d="M 955 570 C 935 585, 920 610, 910 640" stroke="#00FF88" stroke-width="1.5" opacity="0.5"/>
      
      <!-- Tertiary Fine Roots (Fractal feel) -->
      <path d="M 1110 535 C 1125 545, 1135 565, 1145 585" stroke="#00FF88" stroke-width="0.8" opacity="0.4"/>
      <path d="M 890 545 C 875 555, 865 575, 855 595" stroke="#00FF88" stroke-width="0.8" opacity="0.4"/>
      <path d="M 1000 620 C 1015 640, 1030 655, 1040 680" stroke="#00FF88" stroke-width="0.8" opacity="0.4"/>
      <path d="M 1115 507 C 1125 495, 1140 490, 1155 485" stroke="#00FF88" stroke-width="0.6" opacity="0.3"/>
      <path d="M 885 517 C 875 505, 860 500, 845 495" stroke="#00FF88" stroke-width="0.6" opacity="0.3"/>
      
      <!-- Root Data Nodes (Better integrated) -->
      <circle cx="1060" cy="505" r="3" fill="#00B8FF"/>
      <circle cx="940" cy="515" r="3" fill="#00B8FF"/>
      <circle cx="1000" cy="580" r="3" fill="#00B8FF"/>
      <circle cx="900" cy="560" r="2" fill="#00B8FF"/>
      <circle cx="1100" cy="550" r="2" fill="#00B8FF"/>
      <circle cx="1040" cy="650" r="1.5" fill="#00B8FF" opacity="0.6"/>
    </g>
    <!-- 5. PLANT (Above Surface) -->
    <g id="plant">
      <!-- Stem (Multi-segmented for tapering effect) -->
      <path d="M 1000 450 C 1005 400, 990 370, 995 350" fill="none" stroke="url(#stemGrad)" stroke-width="10" stroke-linecap="round"/>
      <path d="M 995 350 C 1000 320, 1010 300, 1005 250" fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round"/>
      <path d="M 1005 250 C 1000 200, 1005 160, 1000 140" fill="none" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round"/>
      <!-- Subtle highlight/inner stem -->
      <path d="M 1000 450 C 1005 400, 990 370, 995 350 C 1000 320, 1010 300, 1005 250 C 1000 200, 1005 160, 1000 140" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <!-- Leaves (More varied and organic) -->
      <use href="#leaf" transform="translate(1003, 400) rotate(45) scale(1.8)"/>
      <use href="#leaf" transform="translate(995, 385) rotate(-55) scale(1.6)"/>
      <use href="#leaf" transform="translate(1006, 360) rotate(35) scale(1.5)"/>
      <use href="#leaf" transform="translate(994, 340) rotate(-40, 0, 0) scale(1.4)"/>
      <use href="#leaf" transform="translate(1008, 300) rotate(50) scale(1.3)"/>
      <use href="#leaf" transform="translate(998, 280) rotate(-30) scale(1.2)"/>
      <use href="#leaf" transform="translate(1005, 240) rotate(45) scale(1.1)"/>
      <use href="#leaf" transform="translate(997, 210) rotate(-25) scale(1.0)"/>
      <use href="#leaf" transform="translate(1003, 180) rotate(20) scale(0.9)"/>
      <use href="#leaf" transform="translate(998, 160) rotate(-15) scale(0.8)"/>
      <use href="#leaf" transform="translate(1000, 138) rotate(0) scale(0.6)"/>
      <!-- Plant Data Nodes -->
      <circle cx="940" cy="330" r="3" fill="#00FF88"/>
      <circle cx="1060" cy="300" r="3" fill="#00FF88"/>
      <circle cx="960" cy="240" r="3" fill="#00FF88"/>
      <circle cx="1040" cy="210" r="3" fill="#00FF88"/>
      <circle cx="1000" cy="160" r="2" fill="#00FF88"/>
    </g>
    <!-- 6. ATMOSPHERE INTERIOR (Weather/Data) -->
    <g id="atmosphere-interior">
      <!-- Sun -->
      <circle cx="1120" cy="180" r="24" fill="#FFB800"/>
      <circle cx="1120" cy="180" r="45" fill="#FFB800" opacity="0.15"/>
      <circle cx="1120" cy="180" r="70" fill="#FFB800" opacity="0.05"/>
      <!-- Clouds (Stylized) -->
      <path d="M 850 200 C 850 180, 880 180, 890 190 C 900 170, 940 170, 950 190 C 960 180, 980 190, 980 210 Z" fill="#ffffff" opacity="0.15"/>
      <path d="M 820 240 C 820 220, 850 220, 860 230 C 870 210, 910 210, 920 230 C 930 220, 950 230, 950 250 Z" fill="#ffffff" opacity="0.1"/>
      <!-- Rain / Precipitation -->
      <line x1="870" y1="210" x2="850" y2="280" stroke="#00B8FF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
      <line x1="900" y1="200" x2="880" y2="270" stroke="#00B8FF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
      <line x1="930" y1="210" x2="910" y2="280" stroke="#00B8FF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
      <line x1="860" y1="250" x2="840" y2="320" stroke="#00B8FF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
      <line x1="890" y1="240" x2="870" y2="310" stroke="#00B8FF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
      <!-- Transpiration (Upward Waves) -->
      <path d="M 950 320 Q 960 300, 950 280 T 950 240" fill="none" stroke="#00FF88" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
      <path d="M 1050 290 Q 1060 270, 1050 250 T 1050 210" fill="none" stroke="#00FF88" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
      <path d="M 980 230 Q 990 210, 980 190 T 980 150" fill="none" stroke="#00FF88" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
      <!-- Wind / Airflow -->
      <path d="M 780 280 C 880 250, 980 300, 1180 220" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 6" opacity="0.2"/>
      <path d="M 800 320 C 900 290, 1000 340, 1200 260" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="8 6" opacity="0.15"/>
    </g>
    <!-- 7. ATMOSPHERE FRONT DOME (Glass Shell) -->
    <path d="M 760 450 A 240 360 0 0 0 1240 450 Z" fill="url(#domeGrad)"/>
    <path d="M 760 450 A 240 360 0 0 0 1240 450" fill="none" stroke="#00B8FF" stroke-width="2" opacity="0.6"/>
    <!-- Dome Holographic Rings (Front) -->
    <path d="M 780 350 A 220 60 0 0 0 1220 350" fill="none" stroke="#00B8FF" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
    <path d="M 830 240 A 170 40 0 0 0 1170 240" fill="none" stroke="#00B8FF" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
    <path d="M 920 140 A 80 20 0 0 0 1080 140" fill="none" stroke="#00B8FF" stroke-width="1" stroke-dasharray="4 8" opacity="0.4"/>
    <!-- 8. SOIL CYLINDER FRONT GLASS -->
    <path d="M 760 450 A 240 80 0 0 0 1240 450 L 1240 620 A 240 80 0 0 1 760 620 Z" fill="url(#glassGrad)"/>
    <path d="M 760 450 A 240 80 0 0 0 1240 450 L 1240 620 A 240 80 0 0 1 760 620 Z" fill="none" stroke="#00FF88" stroke-width="2" opacity="0.8"/>
    <!-- Glass Specular Highlight -->
    <path d="M 775 470 A 225 75 0 0 0 920 525" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
    <path d="M 775 470 L 775 590" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.1"/>
    <!-- Base Tech Rings -->
    <ellipse cx="1000" cy="620" rx="260" ry="90" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.3"/>
    <ellipse cx="1000" cy="620" rx="280" ry="100" fill="none" stroke="#00B8FF" stroke-width="1" stroke-dasharray="12 6" opacity="0.2"/>
    <!-- Base Node Points -->
    <circle cx="740" cy="620" r="3" fill="#00FF88"/>
    <circle cx="1260" cy="620" r="3" fill="#00FF88"/>
    <circle cx="1000" cy="720" r="3" fill="#00B8FF"/>
    <circle cx="1000" cy="520" r="3" fill="#00B8FF"/>
    <!-- ========================================== -->
    <!-- UI DATA PANELS (The "Simulator" Overlay)   -->
    <!-- ========================================== -->
    <!-- Panel 1: ATMOSPHERE (Top Right) -->
    <g transform="translate(1200, 100)">
      <rect x="0" y="0" width="160" height="76" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.5" opacity="0.95"/>
      <rect x="0" y="0" width="4" height="76" rx="2" fill="#FFB800"/>
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" font-weight="700" letter-spacing="1.5">ATMOSPHERE</text>
      <text x="16" y="46" font-family="system-ui, sans-serif" font-size="15" fill="#FFFFFF" font-weight="600">VPD: 1.24 kPa</text>
      <text x="16" y="64" font-family="system-ui, sans-serif" font-size="13" fill="#FFB800" font-weight="500">PAR: 1450 µmol</text>
    </g>
    <path d="M 1120 180 L 1160 138 L 1200 138" fill="none" stroke="#FFB800" stroke-width="1.5" opacity="0.8"/>
    <circle cx="1160" cy="138" r="2" fill="#FFB800"/>
    <!-- Panel 2: CANOPY (Middle Left) -->
    <g transform="translate(620, 260)">
      <rect x="0" y="0" width="160" height="76" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.5" opacity="0.95"/>
      <rect x="156" y="0" width="4" height="76" rx="2" fill="#00FF88"/>
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" font-weight="700" letter-spacing="1.5">CANOPY</text>
      <text x="16" y="46" font-family="system-ui, sans-serif" font-size="15" fill="#FFFFFF" font-weight="600">gs: 0.45 mol/m²s</text>
      <text x="16" y="64" font-family="system-ui, sans-serif" font-size="13" fill="#00FF88" font-weight="500">Ψleaf: -1.1 MPa</text>
    </g>
    <path d="M 940 330 L 820 298 L 780 298" fill="none" stroke="#00FF88" stroke-width="1.5" opacity="0.8"/>
    <circle cx="820" cy="298" r="2" fill="#00FF88"/>
    <!-- Panel 3: RHIZOSPHERE (Bottom Right) -->
    <g transform="translate(1220, 480)">
      <rect x="0" y="0" width="160" height="76" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.5" opacity="0.95"/>
      <rect x="0" y="0" width="4" height="76" rx="2" fill="#00B8FF"/>
      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" font-weight="700" letter-spacing="1.5">RHIZOSPHERE</text>
      <text x="16" y="46" font-family="system-ui, sans-serif" font-size="15" fill="#FFFFFF" font-weight="600">θ: 0.28 cm³/cm³</text>
      <text x="16" y="64" font-family="system-ui, sans-serif" font-size="13" fill="#00B8FF" font-weight="500">Ψsoil: -0.4 MPa</text>
    </g>
    <path d="M 1060 530 L 1180 518 L 1220 518" fill="none" stroke="#00B8FF" stroke-width="1.5" opacity="0.8"/>
    <circle cx="1180" cy="518" r="2" fill="#00B8FF"/>
  </g>
</svg>