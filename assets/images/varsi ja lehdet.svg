    <ellipse cx="140" cy="480" rx="5" ry="2" fill="#1B5E20"/>
    
    <path d="M 137 400 Q 146 405 145 400" stroke="#1B5E20" stroke-width="2" fill="none"/>
    <path d="M 138 320 Q 145 325 144 320" stroke="#1B5E20" stroke-width="2" fill="none"/>
    <path d="M 140 240 Q 147 245 146 240" stroke="#1B5E20" stroke-width="2" fill="none"/>
    <path d="M 142 160 Q 147 165 146 160" stroke="#1B5E20" stroke-width="2" fill="none"/>
