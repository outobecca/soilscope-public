    <use href="#leaf" x="0" y="0" transform="translate(147, 240) rotate(25) scale(0.7)"/>
    <use href="#leaf" x="0" y="0" transform="translate(146, 160) scale(-1, 1) rotate(35) scale(0.6)"/>
    <use href="#leaf" x="0" y="0" transform="translate(148, 90) rotate(45) scale(0.45)"/>
    <use href="#leaf" x="0" y="0" transform="translate(147, 50) scale(-1, 1) rotate(55) scale(0.3)"/>

