    <circle cx="380" cy="380" r="100" fill="none" stroke="#1B5E20" stroke-width="3"/>
    
    <circle cx="380" cy="380" r="98" fill="#F1F8E9"/>
    <circle cx="380" cy="380" r="98" fill="url(#pith-cells)"/>
    
    <circle cx="380" cy="380" r="96" fill="none" stroke="#81C784" stroke-width="8"/>
    
    <circle cx="380" cy="380" r="88" fill="none" stroke="#4CAF50" stroke-width="2" stroke-dasharray="4 2"/>

    <use href="#vascular-bundle" x="380" y="380" transform="rotate(0 380 380)"/>
    <use href="#vascular-bundle" x="380" y="380" transform="rotate(45 380 380)"/>
    <use href="#vascular-bundle" x="380" y="380" transform="rotate(90 380 380)"/>
    <use href="#vascular-bundle" x="380" y="380" transform="rotate(135 380 380)"/>
    <use href="#vascular-bundle" x="380" y="380" transform="rotate(180 380 380)"/>
    <use href="#vascular-bundle" x="380" y="380" transform="rotate(225 380 380)"/>
    <use href="#vascular-bundle" x="380" y="380" transform="rotate(270 380 380)"/>
    <use href="#vascular-bundle" x="380" y="380" transform="rotate(315 380 380)"/>

    <path d="M 485 380 L 500 380" stroke="#757575" stroke-width="1.5"/>
    <circle cx="485" cy="380" r="2" fill="#757575"/>
    <path d="M 465 320 L 480 310" stroke="#757575" stroke-width="1.5"/>
    <circle cx="465" cy="320" r="2" fill="#757575"/>
    <path d="M 440 290 L 455 275" stroke="#757575" stroke-width="1.5"/>
