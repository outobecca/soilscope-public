      <path d="M 20 -3 Q 35 10 50 10" stroke="#A5D6A7" stroke-width="1.5" fill="none"/>
      <path d="M 40 -6 Q 60 5 80 0" stroke="#A5D6A7" stroke-width="1.5" fill="none"/>
