<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="30%" stop-color="#4CAF50"/>
      <stop offset="70%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B5E20"/>
      <stop offset="40%" stop-color="#388E3C"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>

    <pattern id="epidermis" width="20" height="15" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="18" height="13" rx="4" fill="#C8E6C9" stroke="#4CAF50" stroke-width="1.5"/>
    </pattern>

    <pattern id="palisade" width="20" height="40" patternUnits="userSpaceOnUse">
      <rect x="2" y="1" width="16" height="38" rx="6" fill="#81C784" stroke="#2E7D32" stroke-width="1.5"/>
      <circle cx="6" cy="8" r="1.5" fill="#1B5E20"/>
      <circle cx="14" cy="12" r="1.5" fill="#1B5E20"/>
      <circle cx="6" cy="20" r="1.5" fill="#1B5E20"/>
      <circle cx="14" cy="28" r="1.5" fill="#1B5E20"/>
      <circle cx="6" cy="34" r="1.5" fill="#1B5E20"/>
    </pattern>

    <pattern id="spongy" width="40" height="60" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="15" r="10" fill="#AED581" stroke="#4CAF50" stroke-width="1.5"/>
      <circle cx="32" cy="25" r="12" fill="#AED581" stroke="#4CAF50" stroke-width="1.5"/>
      <circle cx="15" cy="45" r="11" fill="#AED581" stroke="#4CAF50" stroke-width="1.5"/>
      <circle cx="35" cy="50" r="9" fill="#AED581" stroke="#4CAF50" stroke-width="1.5"/>
      <circle cx="8" cy="12" r="1.5" fill="#1B5E20"/>
      <circle cx="16" cy="18" r="1.5" fill="#1B5E20"/>
      <circle cx="30" cy="20" r="1.5" fill="#1B5E20"/>
      <circle cx="36" cy="30" r="1.5" fill="#1B5E20"/>
      <circle cx="12" cy="40" r="1.5" fill="#1B5E20"/>
      <circle cx="20" cy="50" r="1.5" fill="#1B5E20"/>
    </pattern>

    <pattern id="pith-cells" width="20" height="34.64" patternUnits="userSpaceOnUse">
