      <circle cx="0" cy="27.32" r="11" fill="none" stroke="#C8E6C9" stroke-width="1.5"/>
      <circle cx="20" cy="27.32" r="11" fill="none" stroke="#C8E6C9" stroke-width="1.5"/>
    </pattern>

    <g id="leaf">
      <path d="M 0 0 C 40 -50, 100 -70, 140 -40 C 110 0, 40 30, 0 0 Z" fill="url(#leafGrad)" filter="url(#drop-shadow)"/>
