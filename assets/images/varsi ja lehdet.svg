      <path d="M -11 -55 L 11 -55 L 6 -25 C 6 -15, -6 -15, -6 -25 Z" fill="#E57373" stroke="#C62828" stroke-width="1"/>
      <circle cx="0" cy="-45" r="4" fill="#FFCDD2" stroke="#C62828" stroke-width="1"/>
      <circle cx="-5" cy="-35" r="3" fill="#FFCDD2" stroke="#C62828" stroke-width="1"/>
      <circle cx="5" cy="-35" r="3" fill="#FFCDD2" stroke="#C62828" stroke-width="1"/>
      <circle cx="0" cy="-25" r="2" fill="#FFCDD2" stroke="#C62828" stroke-width="1"/>
    </g>
