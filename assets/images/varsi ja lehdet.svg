      <path d="M 20 -3 Q 30 -20 45 -25" stroke="#A5D6A7" stroke-width="1.5" fill="none"/>
      <path d="M 40 -6 Q 55 -25 75 -30" stroke="#A5D6A7" stroke-width="1.5" fill="none"/>
      <path d="M 60 -10 Q 80 -30 100 -32" stroke="#A5D6A7" stroke-width="1.5" fill="none"/>
