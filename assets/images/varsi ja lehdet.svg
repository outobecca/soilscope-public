    <circle cx="490" cy="70" r="2" fill="#757575"/>
    <path d="M 490 95 L 505 95" stroke="#757575" stroke-width="1.5"/>
    <circle cx="490" cy="95" r="2" fill="#757575"/>
    <path d="M 490 145 L 505 145" stroke="#757575" stroke-width="1.5"/>
    <circle cx="490" cy="145" r="2" fill="#757575"/>
    <path d="M 490 185 L 505 185" stroke="#757575" stroke-width="1.5"/>
    <circle cx="490" cy="185" r="2" fill="#757575"/>
