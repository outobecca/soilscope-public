    <circle cx="380" cy="145" r="4" fill="#4DB6AC" stroke="#00695C" stroke-width="1"/>
    <circle cx="365" cy="138" r="4" fill="#4DB6AC" stroke="#00695C" stroke-width="1"/>
    <circle cx="395" cy="138" r="4" fill="#4DB6AC" stroke="#00695C" stroke-width="1"/>
    <circle cx="375" cy="155" r="3" fill="#4DB6AC" stroke="#00695C" stroke-width="1"/>
