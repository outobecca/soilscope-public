name: soilscope
description: "Interactive soil biophysics simulator for teaching and research."
publish_to: 'none'
version: 0.1.0+1
homepage: https://github.com/outobecca/soilscope-public
repository: https://github.com/outobecca/soilscope-public
issue_tracker: https://github.com/outobecca/soilscope-public/issues

environment:
  sdk: ^3.11.0

dependencies:
  collection: ^1.18.0
  equations: ^6.0.0
  flame: ^1.18.0
  flame_riverpod: ^5.5.2
  flame_svg: ^1.12.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  riverpod: ^3.2.1
  flutter_svg: ^2.2.4
  freezed_annotation: ^3.1.0
  intl: ^0.20.2
  json_annotation: ^4.11.0
  riverpod_annotation: ^4.0.2
  shared_preferences: ^2.5.2
  oxygen: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  json_serializable: ^6.13.0
  freezed: ^3.2.5
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/scenarios/
    - assets/images/
    - assets/validation/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

