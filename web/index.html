<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SoilScope - Digital Twin for Soil Health Education">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-eval' 'unsafe-inline' https://www.gstatic.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://www.gstatic.com; connect-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com https://www.gstatic.com https://unpkg.com blob: data:;">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SoilScope">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#059669">
  <meta property="og:title" content="SoilScope — Soil Health Simulator">
  <meta property="og:description" content="Interactive soil biophysics simulator for teaching and research.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <title>SoilScope — Soil Health Simulator</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0F172A; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; color: #ECFDF5;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; z-index: 10; }
    .splash-mark { font-size: 28px; font-weight: 700; letter-spacing: 1px; }
    .splash-sub { font-size: 12px; letter-spacing: 2px; color: #6EE7B7;
      text-transform: uppercase; }
    .splash-bar { width: 120px; height: 3px; background: #1E293B;
      border-radius: 2px; overflow: hidden; margin-top: 12px; }
    .splash-bar span { display: block; width: 40%; height: 100%;
      background: #059669; border-radius: 2px; animation: splash 1.2s ease-in-out infinite; }
    @keyframes splash { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
    <div id="splash" aria-label="Loading SoilScope">
    <div class="splash-mark">SoilScope</div>
    <div class="splash-sub">Soil &middot; Water &middot; Life</div>
    <div class="splash-bar"><span></span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
